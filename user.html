<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Portal - Library Management</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <i class="fas fa-book-open"></i>
                <h1>Library Management</h1>
            </div>
            <nav class="nav">
                <a href="index.html">Home</a>
                <a href="user.html" class="active">User Portal</a>
                <a href="admin.html">Admin Portal</a>
            </nav>
        </header>

        <main class="main-content">
            <section class="user-hero">
                <div class="user-hero-content">
                    <h2><i class="fas fa-user"></i> User Portal</h2>
                    <p>Browse books and send requests</p>
                </div>
            </section>

            <!-- Search and Filter -->
            <section class="search-section">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search books by title, author, or ISBN...">
                </div>
                <div class="filter-section">
                    <select id="categoryFilter">
                        <option value="">All Categories</option>
                        <option value="Programming">Programming</option>
                        <option value="Database">Database</option>
                        <option value="Networking">Networking</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </section>

            <!-- Books Display -->
            <section class="books-section">
                <div class="section-header">
                    <h3><i class="fas fa-book"></i> Available Books</h3>
                    <span class="book-count" id="bookCount">0 books</span>
                </div>
                <div class="books-grid" id="userBooksGrid">
                    <!-- Books will be loaded dynamically -->
                </div>
            </section>

            <!-- My Requests -->
            <section class="my-requests-section">
                <div class="section-header">
                    <h3><i class="fas fa-envelope"></i> My Book Requests</h3>
                </div>
                <div class="requests-list" id="myRequestsList">
                    <!-- User's requests will be loaded dynamically -->
                </div>
            </section>
        </main>

        <!-- Book Request Modal -->
        <div class="modal" id="requestModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3><i class="fas fa-paper-plane"></i> Request Book</h3>
                    <button class="modal-close" id="closeModal">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="book-details" id="modalBookDetails">
                        <!-- Book details will be shown here -->
                    </div>
                    <form id="requestForm">
                        <div class="form-group">
                            <label>Your Name</label>
                            <input type="text" id="requesterName" required>
                        </div>
                        <div class="form-group">
                            <label>Student ID</label>
                            <input type="text" id="requesterId" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="requesterEmail" required>
                        </div>
                        <div class="form-group">
                            <label>Message (Optional)</label>
                            <textarea id="requestMessage" rows="2"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-paper-plane"></i> Send Request
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <footer class="footer">
            <p>&copy; 2024 BCA Library Management System. All rights reserved.</p>
        </footer>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
